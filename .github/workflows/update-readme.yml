name: Update README with repos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repo list
        run: |
          curl -s "https://api.github.com/users/pavelkalas/repos?sort=updated&per_page=100" \
            | jq -r '.[] | "* [\(.name)](\(.html_url)) - \(.description // "dn popis")"' \
            > repos.md
      - name: Insert into README
        run: |
          sed -i '/<!-- REPOS-LIST:START -->/,/<!-- REPOS-LIST:END -->/c\<!-- REPOS-LIST:START -->\n'"$(cat repos.md)"'\n<!-- REPOS-LIST:END -->' README.md
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update repo list" || exit 0
          git push

