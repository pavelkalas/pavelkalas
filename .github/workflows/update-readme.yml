name: Update README with showcase repos

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate showcase repo list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -s "https://api.github.com/users/pavelkalas/repos?sort=updated&per_page=100" \
          | jq -r '
              .[] |
              select(.topics | index("showcase")) |
              "* [" + .name + "](" + .html_url + ") - " + (.description // "bez popisu")
            ' > repos.md

      - name: Insert showcase repos into README
        run: |
          python3 <<'EOF'
          from pathlib import Path

          readme_path = Path("README.md")
          repos_path = Path("repos.md")

          readme = readme_path.read_text()
          repos = repos_path.read_text()

          start = "<!-- SHOWCASE-START -->"
          end = "<!-- SHOWCASE-END -->"

          if start not in readme or end not in readme:
              raise Exception("README.md neobsahuje SHOWCASE markery")

          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)

          readme_path.write_text(
              before +
              start +
              "\n" +
              repos +
              "\n" +
              end +
              after
          )
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit -m "Update showcase repositories" || exit 0

          git push
